<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management List</title>

    <style>
        ul li {
            list-style: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        main {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 560px;
            height: fit-content;
        }

        #head {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #e0e0e0;
        }

        #student-name {
            height: 36px;
            padding: 0 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            margin-right: 8px;
            width: 60%;
        }

        #student-name:focus {
            border-color: #185fa5;
            box-shadow: 0 0 0 2px rgba(24, 95, 165, 0.2);
        }

        button {
            height: 36px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            margin-right: 6px;
            margin-bottom: 8px;
        }

        button:hover {
            background: #f0f0f0;
        }

        #add-student {
            border-color: #185fa5;
            color: #185fa5;
        }

        #passed-student {
            border-color: #3b6d11;
            color: #3b6d11;
        }

        #remove-student {
            border-color: #a32d2d;
            color: #a32d2d;
        }

        #head2 {
            font-size: 15px;
            font-weight: 500;
            color: #666;
            margin: 1.5rem 0 0.75rem;
        }

        ul li {
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            background: #fafafa;
            font-size: 14px;
            margin-bottom: 6px;
        }
    </style>

</head>

<body>

    <main>
        <h2 id="head">Student Management List</h2>
        <input type="text" name="" id="student-name">
        <button id="add-student">Add Student</button>
        <button id="passed-student">Show Passed Students</button>
        <button id="remove-student">Remove Last Student</button>

        <h2 id="head2">Student List:</h2>
        <ul id="student-list"></ul>
    </main>

    <script src="/day3/js/students.js"></script>

</body>

</html>
